ju,{ref:t,...e,weights:Ou}));Hu.displayName=`DownloadSimpleIcon`;var Uu=Hu,Wu=_.forwardRef((e,t)=>_.createElement(ju,{ref:t,...e,weights:ku}));Wu.displayName=`XIcon`;var Gu=Wu,Ku=[{id:`metr`,number:`01`,title:`МЭТР`,category:`Производство · RFID`,description:`RFID-система для учёта изделий и операций на производственной линии.`,detail:`Пилотную систему внедрили на участке «Метран».`,featured:!0,document:`act-vnedreniya-metran.pdf`},{id:`kedo`,number:`02`,title:`KEDOLocal`,category:`Документооборот`,description:`Документы, согласования и рабочие задачи в одном корпоративном приложении.`},{id:`shanaydy`,number:`03`,title:`ЩаНайду`,category:`Поиск по книгам · RAG`,description:`Поиск по книгам и ответы на вопросы с указанием найденных фрагментов.`},{id:`giraf`,number:`04`,title:`Жираф`,category:`Метран · ИИ`,description:`Машинное зрение проверяет комплектующие в коробке и наличие датчика.`},{id:`slon`,number:`05`,title:`Слон`,category:`Метран · Контроль сборки`,description:`Контроль сборки датчика: установлены ли болты и модули.`},{id:`tomatoes`,number:`06`,title:`Автоматизированная сортировка томатов`,category:`Автоматизация`,description:`Конвейер, две камеры и нейросеть оценивают качество томатов и сортируют их.`},{id:`screensafer`,number:`07`,title:`ScreenSafer`,category:`Образование · Управление устройствами`,description:`Управление компьютерами кабинета и школьный модуль для материалов, заданий и тестов.`}],qu=[{title:`Акт о внедрении`,subtitle:`Пилотная RFID-система на участке «Метран»`,category:`Внедрение`,file:`act-vnedreniya-metran.pdf`},{title:`Благодарственное письмо «Метран»`,subtitle:`За участие в разработке системы`,category:`Благодарности`,file:`metran-blagodarnost.pdf`},{title:`Инженерные кадры России`,subtitle:`Диплом, I место`,category:`Награды`,file:`ikar.pdf`},{title:`Юные техники и изобретатели`,subtitle:`Диплом, I место в командном зачёте`,category:`Награды`,file:`yunye-tehniki-diplom.pdf`},{title:`Письмо поддержки Grand Trade`,subtitle:`Проектная команда`,category:`Поддержка`,file:`grand-trade-support.pdf`},{title:`Письмо поддержки «Эстрэйд»`,subtitle:`Проектная команда`,category:`Поддержка`,file:`estrade-support.pdf`},{title:`Конкурс «Станкин»`,subtitle:`Диплом лауреата I степени`,category:`Награды`,file:`stankin.pdf`},{title:`ТехноСтрелка`,subtitle:`Диплом, II место`,category:`Награды`,file:`technostrelka.pdf`},{title:`Шаг в будущее`,subtitle:`Диплом за исследовательскую работу`,category:`Награды`,file:`shag-v-buduschee-pukozavr.pdf`},{title:`Шаг в будущее`,subtitle:`Диплом лауреата`,category:`Награды`,file:`shag-v-buduschee.pdf`},{title:`Инженерные кадры России — 2025`,subtitle:`Диплом I места · категория «ИКаР-ТЕХНО-КОД»`,category:`Награды`,file:`ikar-techno-kod-2025.pdf`},{title:`Конкурс юных изобретателей — Станкин`,subtitle:`Лауреат I степени · RFID-метки в производственную линию · 2025`,category:`Награды`,file:`stankin-rfid-2025.pdf`},{title:`Большие вызовы — 2025/2026`,subtitle:`Диплом призёра · направление «Передовые производственные технологии»`,category:`Награды`,file:`bolshie-vyzovy-2025-2026.pdf`}],Ju=[{file:`photo-01.webp`,alt:`Два участника команды показывают небольшие технические устройства`,ratio:`4 / 3`},{file:`photo-02.webp`,alt:`Участник команды рассказывает о проекте посетителям выставки`,ratio:`4 / 3`},{file:`photo-03.webp`,alt:`Команда и наставники вместе на мероприятии`,ratio:`4 / 3`},{file:`photo-04.webp`,alt:`Команда демонстрирует проект группе посетителей`,ratio:`4 / 3`},{file:`photo-05.webp`,alt:`Участник команды знакомится с оборудованием на стенде «Метран»`,ratio:`2 / 3`},{file:`photo-06.webp`,alt:`Рабочий экран проекта и предметы с символикой «Метран»`,ratio:`4 / 3`},{file:`photo-07.webp`,alt:`Команда держит дипломы на сцене конкурса`,ratio:`4 / 3`},{file:`photo-08.webp`,alt:`Команда представляет проект у стенда «Метран»`,ratio:`4 / 3`},{file:`photo-09.webp`,alt:`Команда выступает с презентацией проекта`,ratio:`4 / 3`},{file:`photo-10.webp`,alt:`Участники и наставники с дипломами на сцене`,ratio:`3 / 2`},{file:`photo-11.webp`,alt:`Команда у выставочного стенда «Метран»`,ratio:`3 / 4`},{file:`photo-12.webp`,alt:`Участники работают с ноутбуком во время мероприятия`,ratio:`4 / 3`},{file:`photo-13.webp`,alt:`Два участника команды с дипломом «ТехноСтрелка»`,ratio:`4 / 3`}],Yu={metr:{lead:`RFID-система помогает проследить путь датчика по производственному участку «Метран» и сохранить историю операций с ним.`,sections:[{title:`Где возникает проблема`,paragraphs:[`Датчик проходит несколько этапов производства. Чтобы разобраться с конкретным изделием, нужно знать, где оно находится, какие операции уже выполнены, кто с ним работал и был ли обнаружен дефект. При ручном учёте эту историю приходится собирать из отдельных записей. Это осложняет поиск деталей, инвентаризацию и разбор брака.`,`Команда побывала на производстве «Метран», изучила существующий процесс со штрихкодами и обсудила со специалистами, где в нём пригодится RFID-учёт.`]},{title:`Путь изделия в системе`,paragraphs:[`RFID-метка даёт изделию уникальный идентификатор. Считыватель распознаёт его, а приложение оператора связывает отметку с производственным этапом. В системе можно фиксировать операции, результаты проверок и брак. Отдельные метки используются для авторизации сотрудников, поэтому запись об операции связана и с изделием, и с тем, кто её выполнил.`,`История хранится в PostgreSQL: данные о деталях, этапах, операциях и сотрудниках остаются доступными для поиска и просмотра. Для операторов и администрации подготовлены приложения на C# и WPF.`]},{title:`Что собрано`,paragraphs:[`В прототип вошли RFID-считыватель на Arduino Nano, разработанные командой корпус и подставка, Raspberry Pi 4B, база данных и приложение. По паспорту проекта, считыватель собрали, испытали и связали с приложением. Также реализовали RFID-авторизацию, учёт тестов и отметку брака.`]},{title:`Результат на участке`,paragraphs:[`Пилотную систему внедрили на участке «Метран»; это подтверждает акт о внедрении.`]}],document:{file:`act-vnedreniya-metran.pdf`,label:`Акт о внедрении`}},kedo:{lead:`KEDOLocal хранит документы и поддерживает их согласование, задачи и переписку сотрудников.`,sections:[{title:`Для чего нужен KEDOLocal`,paragraphs:[`Сотрудник загружает документ, отправляет его на согласование, следит за этапами и позже открывает нужную версию.`,`Доступ к документам зависит от роли сотрудника. Администраторы управляют учётными записями, подразделениями и настройками системы.`]},{title:`Документы и согласование`,paragraphs:[`В описании проекта представлен архив с папками, загрузкой файлов, версиями, вложениями, предпросмотром, скачиванием, избранным и корзиной. Поиск помогает найти нужный документ.`,`Для обработки документа предусмотрены маршруты с этапами согласования, отметки о подписании и связанные действия. Доступ к документам и операциям разграничивается: разные сотрудники видят и делают то, что положено их роли.`]},{title:`Работа вокруг документа`,paragraphs:[`В системе также описаны задачи, уведомления, справочник сотрудников и подразделений. Сообщения и беседы с вложениями позволяют обсуждать рабочие вопросы рядом с остальными инструментами. Административная часть включает управление пользователями, контроль сессий и устройств, защитные функции и аудит действий.`]},{title:`На чём работает`,paragraphs:[`Текущая серверная часть написана на Node.js и использует PostgreSQL. Параллельно создаётся API на FastAPI для тех же рабочих процессов.`]}]},shanaydy:{lead:`«ЩаНайду» ищет нужное место в загруженных книгах и помогает ответить на вопрос со ссылкой на текст.`,sections:[{title:`Когда нужна не вся книга`,paragraphs:[`Вопрос по книге часто требует одного эпизода или нескольких абзацев. «ЩаНайду» позволяет загрузить книги, выбрать одну из них или искать сразу по всей библиотеке и сформулировать запрос обычным языком. Это можно сделать в браузере или через Telegram-бота.`,`У приложения два режима. «Вопрос по тексту» формирует ответ на основе найденных отрывков. «Найти фрагмент» показывает подходящее место в книге. Если главы и строки удалось определить, они указываются рядом с ответом.`]},{title:`Что происходит после загрузки`,paragraphs:[`Приложение извлекает текст и делит его на небольшие фрагменты, сохраняя сведения о главах и строках. Фрагменты попадают в локальный индекс ChromaDB. SentenceTransformer находит места, близкие к запросу по смыслу, а CrossEncoder уточняет порядок найденного.`,`После поиска выбранные отрывки передаются GigaChat для составления ответа.`]},{title:`Форматы и запуск`,paragraphs:[`Проект работает с TXT, PDF, FB2, EPUB, RTF и DOCX. Веб-часть построена на FastAPI; в ней можно загружать и удалять книги, отправлять запросы и менять настройки. Приложение запускается локально или через Docker, а индекс сохраняется между запусками.`,`Книги и поисковый индекс хранятся локально. Для составления ответов нужно настроить доступ к GigaChat API и подключение к сети.`]}]},giraf:{lead:`«Жираф» проверяет комплектность заказа перед отправкой заказчику.`,sections:[{title:`Последняя проверка перед отправкой`,paragraphs:[`Перед отправкой датчика нужно убедиться, что в коробке находится сам датчик и вся предусмотренная комплектация. «Жираф» представляет собой рабочий стол со станцией машинного зрения, которая определяет наличие нужных предметов.`,`«Слон» отдельно проверяет, установлены ли болты и модули в самом датчике.`]}]},slon:{lead:`Проверка болтов и модулей в собранном датчике.`,sections:[{title:`Контроль сборки`,paragraphs:[`«Слон» проверяет, установлены ли все предусмотренные болты и модули в собранном датчике. «Жираф» проверяет комплектацию коробки перед отправкой.`]}]},tomatoes:{lead:`Стенд осматривает томаты на конвейере, определяет сорт и направляет каждый плод в один из трёх контейнеров.`,sections:[{title:`Почему сортировку решили автоматизировать`,paragraphs:[`При ручной сортировке человек осматривает плоды один за другим на протяжении всей смены. Такая работа монотонна: дефект можно пропустить, а оценка качества у разных людей может различаться. Дополнительные касания способны повредить томаты. Результаты проверки партии при этом приходится записывать отдельно.`]},{title:`Что происходит с томатом`,paragraphs:[`Плод движется по конвейеру в фотобокс. Две камеры снимают его с разных сторон; нейросеть анализирует изображения, ищет дефекты и определяет сорт. Затем поворотный шлюз отправляет томат в один из трёх контейнеров.`,`Решение по каждому плоду записывается в журнал для отчёта за смену.`]},{title:`Что получилось`,paragraphs:[`На стенде работают конвейер, фотобокс и сортирующий шлюз. По данным команды, точность классификации составляет 96%.`]}]},screensafer:{lead:`ScreenSafer помогает управлять компьютерами в кабинете; модуль School добавляет расписание, материалы, задания и тесты.`,sections:[{title:`Компьютеры под управлением`,paragraphs:[`В базовом ScreenSafer есть Server на компьютере учителя или администратора и Client на управляемых устройствах. Через Server можно видеть состояние компьютеров, блокировать и разблокировать их, применять политики, ограничивать игры и открывать нужные сайты или приложения.`,`Связь в кабинете может временно пропасть. На этот случай Client переходит в свободный режим и пытается вновь подключиться к Server. Так предусмотрено поведение устройства, когда команда с сервера недоступна.`]},{title:`Урок в ScreenSafer School`,paragraphs:[`School расширяет тот же проект учебными инструментами. Расписание составляется по классам, группам и кабинетам; опубликованная версия синхронизируется с VPS. Учитель работает через Server, ученик получает материалы и выполняет задания через Client.`,`Файлы уроков хранятся на Server и передаются Client по защищённому соединению. Учитель может выдать задание со сроком сдачи; ученик отправляет текст или файл, в работе можно указать нескольких авторов. После проверки учитель принимает работу либо возвращает на доработку с комментарием.`]},{title:`Тесты и проверка`,paragraphs:[`В редакторе тестов есть вопросы с одним и несколькими правильными ответами, коротким ответом и сопоставлением. Система автоматически проверяет ответы и считает баллы. Тест можно распечатать вместе с ключом.`,`GigaChat способен подготовить черновик теста, который учитель затем редактирует. Для этой функции нужен API-ключ; без него тест составляют вручную. Списка учеников и электронного журнала оценок в School нет.`]},{title:`Что уже готово`,paragraphs:[`Базовый ScreenSafer запускали с Server на основном компьютере и Client в виртуальной машине. Для School подготовлены установщики Server и Client под Windows, а панель расписания размещена на VPS.`]}]}},Xu=e=>`./${e}`,Zu=[`Все`,`Награды`,`Благодарности`,`Поддержка`,`Внедрение`],Qu=(e=``)=>`${window.location.pathname}${e?`#${e}`:``}`,$u=e=>`${window.location.pathname}?project=${encodeURIComponent(e)}`;function ed({children:e,className:t=``,delay:n=0}){let r=Su();return(0,B.jsx)(U.div,{className:t,initial:!r&&{opacity:0,y:24},whileInView:r?void 0:{opacity:1,y:0},viewport:{once:!0,amount:.12},transition:{duration:.65,delay:n,ease:[.22,1,.36,1]},children:e})}function td({src:e,alt:t,className:n=``,loading:r=`lazy`}){let[i,a]=(0,_.useState)(`loading`);return(0,B.jsx)(`span`,{className:`image-shell ${n} ${i===`loading`?`image-shell--loading`:``}`,children:i===`error`?(0,B.jsx)(`span`,{className:`image-error`,children:`Изображение не загрузилось`}):(0,B.jsx)(`img`,{src:e,alt:t,loading:r,decoding:`async`,onLoad:()=>a(`loaded`),onError:()=>a(`error`)})})}function W({isDetail:e=!1}){let[t,n]=(0,_.useState)(``);return(0,_.useEffect)(()=>{let e=[`projects`,`documents`,`photos`].map(e=>document.getElementById(e)).filter(Boolean),t=new IntersectionObserver(e=>{let t=e.filter(e=>e.isIntersecting).sort((e,t)=>t.intersectionRatio-e.intersectionRatio);t[0]&&n(t[0].target.id)},{rootMargin:`-20% 0px -55% 0px`,threshold:[0,.1,.25,.5]});return e.forEach(e=>t.observe(e)),()=>t.disconnect()},[]),(0,B.jsx)(`header`,{className:`site-header`,children:(0,B.jsxs)(`div`,{className:`shell
